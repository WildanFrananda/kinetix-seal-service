language: "id-ID"
reviews:
  profile: "assertive"
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "development"
  path_instructions:
    - path: "src/**"
      instructions: |
        - Enforce AGENTS.md strictly: every type alias belongs in `src/types/*.type.ts` (one type per file), never inline inside class, service, or adapter files.
        - Flag any module-level helper functions inside files that define a class.
        - Flag any code comments, `any`, non-null assertions (`!`), named arrow functions (`const fn = () =>`), inline exports (exports must sit at the bottom of the file), or `#private` syntax (must use explicit `private`).
        - Flag any hardcoded fallback secrets, environment defaults, or mocked/dummy production logic.
    - path: "src/domain/**"
      instructions: |
        Ensure domain modules stay pure with zero I/O or infrastructure imports.
    - path: "contracts/**"
      instructions: |
        - Every Compact file must start with `// SPDX-License-Identifier: MIT` and have no other comments.
        - Exports sit at the bottom in one `export { ... };` block.
        - Stateful modules must not import another stateful module.
    - path: "tests/**"
      instructions: |
        Verify hand-written fakes in `tests/fakes/` are used without mocking frameworks, and database tests run against real Postgres.
chat:
  auto_reply: true
