name: kinetix-seal-toolchain

services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-ephemeral-not-a-deployed-credential
      POSTGRES_DB: kinetix_seal_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci -d kinetix_seal_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  toolchain:
    build:
      context: .
    image: kinetix-seal-toolchain:local
    working_dir: /workspace
    environment:
      npm_config_cache: /npm-cache
      MIDNIGHT_PP: /zk-params
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
      KINETIX_SEAL_TEST_DATABASE_URL: postgresql://ci:ci-ephemeral-not-a-deployed-credential@postgres:5432/kinetix_seal_test
    volumes:
      - ..:/workspace
      - node_modules:/workspace/node_modules
      - contracts_node_modules:/workspace/contracts/node_modules
      - npm_cache:/npm-cache
      - zk_params:/zk-params
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  node_modules:
  contracts_node_modules:
  npm_cache:
  zk_params:
